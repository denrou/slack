# Builds the binaries and publishes a GitHub Release when a v* tag is pushed.
# Install is the Homebrew tap (denrou/homebrew-slack, told about the release
# by the last job), the archive or `cargo install --git` (see README).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml version is $version but the tag is v$tag" >&2
            exit 1
          fi

      - run: cargo fmt --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Deliberate: the Linux archive links the runner's glibc, so this
          # image sets the oldest distro the binary runs on. Bump it when the
          # 24.04 image retires; the other jobs can follow ubuntu-latest.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package the binary with the README and the licence
        run: |
          name="slack-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/slack" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    # A personal token, as the workflow token cannot reach another repository.
    # Without the secret the step is skipped: run the command by hand then.
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Ask the tap to rewrite its formula
        if: env.GH_TOKEN != ''
        run: gh workflow run update-formula.yml --repo denrou/homebrew-slack
