# Format, lint and test on every push to main and every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked

      - run: shellcheck tools/answer/answer tools/answer/test tools/answer/fixtures/gh

      - run: tools/answer/test
