[package]
name = "slack"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Read and answer Slack from the terminal: what needs you, a count for the status bar, send, mark read"
license = "MIT"
repository = "https://github.com/denrou/slack"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
percent-encoding = "2.3.2"
ratatui = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tungstenite = "0.30.0"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
strip = true
