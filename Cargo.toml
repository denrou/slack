[package]
name = "slack"
version = "0.17.0"
edition = "2024"
rust-version = "1.88"
description = "Read and answer Slack from the terminal: what needs you, a count for the status bar, send, mark read"
license = "MIT"
repository = "https://github.com/denrou/slack"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
emojis = "0.9.1"
jiff = "0.2.38"
percent-encoding = "2.3.2"
# The line-info feature gives the wrapped row of a line, which the
# messages pane scrolls by.
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
# The rustls feature for Slack's socket (`rtm.rs`): ureq's TLS stack, so
# the Linux build needs no OpenSSL.
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
strip = true
